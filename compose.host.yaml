services:
  database:
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
  remote-play:
    network_mode: host
    ports: !reset []
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:${PORT:-8080}
      Database__Host: 127.0.0.1
      Database__Port: ${DB_PORT:-15432}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-8080}/healthz > /dev/null"]
