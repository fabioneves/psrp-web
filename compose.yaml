x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
services:
  database:
    image: postgres:17-alpine
    logging: *logging
    environment:
      POSTGRES_DB: remoteplay
      POSTGRES_USER: remoteplay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remoteplay-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remoteplay -d remoteplay"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  remote-play:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    logging: *logging
    ports:
      - "${PORT:-8080}:8080"
      # WebRTC video, chosen per viewer under Stream settings. Forward this UDP port like the HTTPS one to use it from outside.
      - "${WEBRTC_PORT:-8443}:${WEBRTC_PORT:-8443}/udp"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      WEBRTC_PORT: ${WEBRTC_PORT:-8443}
      # Addresses or names browsers can reach this server on. Empty: the public name below, plus whatever the host itself has.
      WEBRTC_PUBLIC_ADDRESS: ${WEBRTC_PUBLIC_ADDRESS:-}
      # Only where the router forwards a different outside port to WEBRTC_PORT.
      WEBRTC_PUBLIC_PORT: ${WEBRTC_PUBLIC_PORT:-}
      REMOTE_PLAY_DOMAIN: ${REMOTE_PLAY_DOMAIN:-}
      # Browser tests only: lets a ticket ask for lost data-channel fragments.
      WEBRTC_TEST_DROP: ${WEBRTC_TEST_DROP:-}
      # Browser tests only: advertise nothing but WEBRTC_PUBLIC_ADDRESS, so the tests' lossy relay cannot be bypassed.
      WEBRTC_PUBLIC_ONLY: ${WEBRTC_PUBLIC_ONLY:-}
      Database__Host: database
      Database__Port: 5432
      Database__Name: remoteplay
      Database__User: remoteplay
      Database__Password: ${DB_PASSWORD:-remoteplay-local}
      JWT__Secret: ${JWT_SECRET:-}
      DECODER_THREADS: ${DECODER_THREADS:-1}
      ENCODER_THREADS: ${ENCODER_THREADS:-4}
      DISCOVERY_SUBNETS: ${DISCOVERY_SUBNETS:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    volumes:
      - app-data:/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  postgres-data:
  app-data:
