services:
  remote-play:
    network_mode: host
    ports: !reset []
  proxy:
    network_mode: host
    ports: !reset []
    environment:
      REMOTE_PLAY_UPSTREAM: 127.0.0.1:${PORT:-8080}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
