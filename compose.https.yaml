services:
  remote-play:
    ports: !override
      - "${HTTP_BIND:-127.0.0.1}:${PORT:-8080}:8080"
  proxy:
    image: caddy:2-alpine
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      REMOTE_PLAY_DOMAIN: ${REMOTE_PLAY_DOMAIN:?Set REMOTE_PLAY_DOMAIN to your public DNS hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      remote-play:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
